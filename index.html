<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Productos</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .seccion { border: 1px solid #ccc; padding: 1rem; margin-bottom: 2rem; border-radius: 8px; }
        input, button { padding: 0.5rem; margin: 0.2rem; }
        .producto-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 0.5rem 0; }
        .precio { font-weight: bold; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>Gestión de Productos</h1>

       <!-- Sección de Administración (CRUD) -->
    <div class="seccion">
        <h2>Administrar Productos</h2>
        
        <!-- NUEVO BUSCADOR PARA ADMINISTRAR -->
        <input type="text" id="buscarAdminInput" placeholder="🔍 Buscar producto para editar..." oninput="filtrarAdmin()" style="width: 100%; margin-bottom: 1rem;">
        
        <input type="text" id="nombreInput" placeholder="Nombre del producto">
        <input type="number" id="precioInput" placeholder="Precio" step="0.01">
        <button onclick="crearProducto()">Agregar / Actualizar</button>
        <input type="hidden" id="productoId" value=""> <!-- Para saber si editamos -->
        
        <h3>Lista para Administrar</h3>
        <div id="listaAdmin"></div>
    </div>

    <!-- Sección de Consulta (Pública) -->
    <div class="seccion">
        <h2>Consultar Precios</h2>
        <input type="text" id="buscarInput" placeholder="Buscar producto..." oninput="filtrarProductos()">
        <div id="listaConsulta"></div>
    </div>

    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
