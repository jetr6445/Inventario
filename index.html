5<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Productos</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #333; }
        
        /* Regla general para inputs y botones (aumento de tamaño) */
        input, button { 
            padding: 0.6rem; 
            margin: 0.2rem; 
            font-size: 1.05rem; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        
        input::placeholder {
            font-size: 1.05rem;
            color: #888;
        }

        /* --- ESTILOS DE LAS PESTAÑAS (TABS) --- */
        .tabs-container {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 1.5rem;
        }
        
        .tab-btn {
            background: none;
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            color: #666;
            cursor: pointer;
            font-weight: 500;
            position: relative;
            transition: color 0.3s;
        }
        
        .tab-btn:hover { color: #1a73e8; }
        .tab-btn.active { color: #1a73e8; }
        
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #1a73e8;
            border-top-left-radius: 3px;
            border-top-right-radius: 3px;
        }

        /* --- ESTILOS DE LAS SECCIONES --- */
        .seccion { display: none; }
        .seccion.active { display: block; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ESTILOS DE LA LISTA DE PRODUCTOS --- */
        .producto-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #eee; 
            padding: 0.8rem 0; 
            gap: 1rem;
        }
        .precio { font-weight: bold; color: #2e7d32; }
        
        .acciones-container {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        /* --- ESTILOS DE BOTONES --- */
        /* Botón Principal (Agregar/Actualizar) */
        .btn-principal {
            background-color: #00a8ff; 
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            -webkit-appearance: none;
            appearance: none;
        }
        .btn-principal:hover { background-color: #0097e6; }
        .btn-principal:active { transform: scale(0.98); }
        
        /* Botones de Acción (Editar/Eliminar) */
        .btn-accion { 
            padding: 0.4rem 0.8rem; 
            border-radius: 6px; 
            cursor: pointer; 
            border: none; 
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            transition: opacity 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }
        .btn-accion:hover { opacity: 0.8; }
        .btn-editar { background-color: #1a73e8; }
        .btn-eliminar { background-color: #dc3545; }

        /* --- ESTILOS PARA EL BUSCADOR CON BOTÓN DE LIMPIAR (X) --- */
        .buscador-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 300px;
            margin-bottom: 1rem;
        }

        .buscador-container input {
            width: 100%;
            padding-right: 2rem;
            box-sizing: border-box;
            margin: 0;
        }

        .btn-limpiar {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #f1f3f4; 
            border: none;
            border-radius: 50%; 
            width: 24px;
            height: 24px;
            display: none; 
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #5f6368; 
            transition: background-color 0.2s, color 0.2s;
            padding: 0; 
            -webkit-appearance: none;
            appearance: none;
        }

        .btn-limpiar:hover {
            background-color: #e2e6ea;
            color: #202124;
        }
        
        .btn-limpiar svg {
            width: 14px;
            height: 14px;
            stroke-width: 2.5;
        }
    </style>
</head>
<body>
    <h1>Gestión de Productos</h1>

    <!-- Contenedor de las Pestañas -->
    <div class="tabs-container">
        <button class="tab-btn active" onclick="cambiarPestana('consulta', this)">Consultar Precios</button>
        <button class="tab-btn" onclick="cambiarPestana('admin', this)">Administrar Productos</button>
        <button class="tab-btn" onclick="cambiarPestana('carrito', this)">Cotizar / Carrito</button>
    </div>

    <!-- Pestaña 1: Consultar (Activa por defecto) -->
    <div id="seccion-consulta" class="seccion active">
        <h2>Consultar Precios</h2>
       <div class="buscador-container">
            <input type="text" id="buscarInput" placeholder="🧐 Buscar producto..." oninput="filtrarProductos()">
            
            <button class="btn-limpiar" id="btnLimpiarConsulta" onclick="limpiarBuscador('buscarInput', 'btnLimpiarConsulta')" title="Limpiar búsqueda">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div id="listaConsulta"></div>
    </div>

    <!-- Pestaña 2: Administrar (Oculta por defecto) -->
    <div id="seccion-admin" class="seccion">
        <h2>Administrar Productos</h2>
        
        <input type="text" id="buscarAdminInput" placeholder="🔍 Buscar producto para editar..." oninput="filtrarAdmin()" style="width: 100%; margin-bottom: 1rem;">
        
        <div style="margin-bottom: 1rem;">
            <input type="text" id="nombreInput" placeholder="Nombre del producto">
            <input type="number" id="precioInput" placeholder="Precio" step="0.01">
            <button class="btn-principal" onclick="crearProducto()">Agregar / Actualizar</button>
        </div>
        
        <input type="hidden" id="productoId" value="">
        
        <h3>Lista para Administrar</h3>
        <div id="listaAdmin"></div>
    </div>

    <!-- Pestaña 3: Carrito / Cotizador (Oculta por defecto) -->
    <div id="seccion-carrito" class="seccion">
        <h2>Cotizar Productos</h2>
        <p>Selecciona los productos y las cantidades para calcular el total.</p>
        
        <!-- Aquí se dibujará la lista de productos para seleccionar -->
        <div id="listaCarrito" style="margin-top: 1.5rem;">
            <!-- Contenido generado por JS -->
        </div>

        <div style="margin-top: 2rem; padding: 1rem; background-color: #f8f9fa; border-radius: 8px; border: 1px solid #e0e0e0; text-align: right;">
            <h3 style="margin: 0; color: #333;">Total a Pagar:</h3>
            <span id="totalCarrito" style="font-size: 2rem; font-weight: bold; color: #2e7d32;">$0</span>
        </div>
    </div>

    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
